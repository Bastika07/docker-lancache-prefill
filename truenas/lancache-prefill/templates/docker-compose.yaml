{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.prefill_container_name, "image") %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]) %}
{% do c1.healthcheck.disable() %}

{% do c1.environment.add_env("DATA_DIR", values.consts.data_dir) %}
{% do c1.environment.add_env("ENABLE_STEAM", values.prefill.enable_steam) %}
{% do c1.environment.add_env("PREFILL_PARAMS_STEAM", values.prefill.get("prefill_params_steam", "--recent")) %}
{% do c1.environment.add_env("CRON_SCHED_STEAM", values.prefill.get("cron_sched_steam", "0 2 * * *")) %}
{% do c1.environment.add_env("ENABLE_EPIC", values.prefill.enable_epic) %}
{% do c1.environment.add_env("PREFILL_PARAMS_EPIC", values.prefill.get("prefill_params_epic", "")) %}
{% do c1.environment.add_env("CRON_SCHED_EPIC", values.prefill.get("cron_sched_epic", "0 4 * * *")) %}
{% do c1.environment.add_env("ENABLE_BN", values.prefill.enable_bn) %}
{% do c1.environment.add_env("PREFILL_PARAMS_BN", values.prefill.get("prefill_params_bn", "")) %}
{% do c1.environment.add_env("CRON_SCHED_BN", values.prefill.get("cron_sched_bn", "0 5 * * *")) %}
{% do c1.environment.add_env("CRON_SCHED_GLOBAL", values.prefill.cron_sched_global) %}
{% do c1.environment.add_env("UPDATES", values.prefill.updates) %}
{% do c1.environment.add_env("PREFILL_ONSTARTUP", values.prefill.prefill_onstartup) %}
{% do c1.environment.add_env("LOGCLEANUP", values.prefill.logcleanup) %}
{% do c1.environment.add_user_envs(values.prefill.additional_envs) %}

{% do c1.add_storage(values.consts.data_dir, values.storage.data) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{{ tpl.render() | tojson }}
